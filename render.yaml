services:
  - type: web
    name: razorstack-trading-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: APP_NAME
        value: Razorstack Trading API
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/trading.db
      - key: AUTO_CREATE_DB
        value: "true"
      - key: MOCK_STATE_PATH
        value: /var/data/mock-broker-state.json
      - key: BROKER_MODE
        value: mock
      - key: ALPACA_PAPER
        value: "true"
      - key: XAI_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
    disk:
      name: razorstack-trading-data
      mountPath: /var/data
      sizeGB: 1
